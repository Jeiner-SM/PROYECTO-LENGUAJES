<section class="page-shell py-16" style="background-color: #f9fafb; min-height: 100vh;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center mb-14">
            <h1 class="text-4xl font-bold" style="color: #1e5f74;">Directorio de Empresas</h1>
            <p class="mt-4 text-gray-600 max-w-2xl mx-auto">Conoce a las empresas líderes que confían en TalentHub para
                encontrar al mejor talento del mercado.</p>
        </div>

        <div class="">
            @if (loading()) {

            <div class="loading">
                Cargando empresas...
            </div>

            } @else {

            <div class="empresas-grid">

                @for (empresa of empresas(); track empresa.id) {

                <app-empresa-card [empresa]="empresa">
                </app-empresa-card>

                }

            </div>

            }
        </div>

        <div class="mt-12 text-center">
            <p class="text-gray-500">¿Eres una empresa y deseas publicar vacantes?</p>
            <button class="mt-4 border-2 font-bold py-2 px-6 rounded-lg transition-colors"
                style="border-color: #1e5f74; color: #1e5f74; cursor: pointer;" routerLink="/auth/register">
                Registrar mi empresa
            </button>
        </div>
    </div>
</section>
