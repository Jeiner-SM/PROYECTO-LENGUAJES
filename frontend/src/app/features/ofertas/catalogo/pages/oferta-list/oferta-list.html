<section class="page-shell py-12" style="background-color: #f9fafb; min-height: 100vh;">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="bg-white rounded-xl shadow-sm p-6 mb-10 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold" style="color: #1e5f74;">Explorar Ofertas</h1>
        <p class="text-gray-500 text-sm mt-1">Encuentra el empleo que mejor se adapte a ti.</p>
      </div>
      <div class="w-full md:w-1/3 flex gap-2">
        <input type="text" placeholder="Busca por cargo o empresa"
               [ngModel]="criterioBusqueda()" (ngModelChange)="filtrarEmpleos($event)"
               class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none"/>
        <button class="text-white px-4 py-2 rounded-lg font-semibold" style="background-color: #1e5f74;" type="button">
          <i class="pi pi-search"></i>
        </button>
      </div>
    </div>

    @if (loading()) {
      <div class="flex justify-center items-center py-20">
        <i class="pi pi-spin pi-spinner text-4xl" style="color: #1e5f74;"></i>
      </div>
    } @else {
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        @for (job of ofertasFiltradas(); track job.id) {
          
            <app-oferta-card [oferta]="job"></app-oferta-card>
          
        } @empty {
          <div class="col-span-full text-center py-16 text-gray-500 bg-white border border-gray-100 rounded-xl shadow-sm">
            <i class="pi pi-folder-open text-4xl mb-3"></i>
            <p class="text-lg">No encontramos ofertas laborales con esa búsqueda.</p>
          </div>
        }
      </div>
    }
  </div>
</section>
